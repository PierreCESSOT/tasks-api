name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
      version: ${{ steps.vars.outputs.version }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Calculer le nom de l'image et la version
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tasks-api" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.version }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lancer l'image du commit
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          docker run -d --name api -p 8000:8000 "${{ needs.build.outputs.image }}:sha-${SHORT_SHA}"

      - name: Test de fumée
        run: |
          for path in health version; do
            ok=0
            for i in $(seq 1 15); do
              if curl -fsS "http://localhost:8000/$path"; then ok=1; echo; break; fi
              echo "Essai $i : /$path pas encore prêt"
              sleep 2
            done
            [ "$ok" = 1 ] || { docker logs api; exit 1; }
          done

  deploy-production:
    needs: [build, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lancer l'image de la release
        run: |
          docker run -d --name api -p 8000:8000 "${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}"

      - name: Test de fumée
        run: |
          for path in health version; do
            ok=0
            for i in $(seq 1 15); do
              if curl -fsS "http://localhost:8000/$path"; then ok=1; echo; break; fi
              echo "Essai $i : /$path pas encore prêt"
              sleep 2
            done
            [ "$ok" = 1 ] || { docker logs api; exit 1; }
          done